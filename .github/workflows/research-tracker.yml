name: Apply reviewed research tracker setup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [configs/issue9_handoff_operation.json]

permissions:
  contents: read
  issues: write

concurrency:
  group: research-tracker
  cancel-in-progress: false

jobs:
  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Apply explicit research management payload
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/tools/manage_research_tracker.py?ref=$GITHUB_SHA" --jq .content | base64 --decode > "$RUNNER_TEMP/manage_research_tracker.py"
          python3 "$RUNNER_TEMP/manage_research_tracker.py"
      - name: Update only the authorized Issue 9 handoff
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/configs/issue9_handoff_operation.json?ref=$GITHUB_SHA" --jq .content | base64 --decode > "$RUNNER_TEMP/issue9_handoff.json"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          spec = json.loads((Path(os.environ['RUNNER_TEMP']) / 'issue9_handoff.json').read_text())
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == spec['repository'] == 'shuo19mo/prediciton-token'
          assert spec['issue_number'] == 9 and spec['expected_state'] == 'open'
          def api(path, method='GET', body=None):
              args = ['gh', 'api', 'repos/' + repo + path, '--method', method]
              if body is not None:
                  args += ['--input', '-']
              result = subprocess.run(args, input=None if body is None else json.dumps(body), text=True, capture_output=True, check=True)
              return json.loads(result.stdout)
          current = api('/issues/9')
          assert current['title'] == spec['expected_title'] and current['state'] == 'open'
          if current['body'] != spec['body']:
              assert current['updated_at'] == spec['expected_updated_at'], 'Issue changed after review; refusing overwrite'
              updated = api('/issues/9', 'PATCH', {'body': spec['body']})
              assert updated['body'] == spec['body'] and updated['state'] == 'open'
          comments = []
          for page in range(1, 101):
              batch = api('/issues/9/comments?per_page=100&page=' + str(page))
              comments.extend(batch)
              if len(batch) < 100:
                  break
          else:
              raise RuntimeError('Comment pagination exceeded; refusing mutation')
          marker = '<!-- research-operation:detail-issue9-handoff-2026-09-29 -->'
          if not any(marker in c['body'] for c in comments):
              api('/issues/9/comments', 'POST', {'body': spec['comment']})
          print(json.dumps({'issue': 9, 'state': 'open', 'operation': 'detail_handoff', 'created_issues': 0, 'closed_issues': 0, 'milestone_changes': 0}))
          PY
